[package]
name = "cutmary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native GTK4/Libadwaita launcher that installs and runs macOS CapCut on Linux via Rosemary"
license = "MIT"
repository = "https://github.com/oriilol/cutmary"
readme = "README.md"
publish = false

[[bin]]
name = "cutmary"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
async-channel = "2"
libc = "0.2"
plist = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
